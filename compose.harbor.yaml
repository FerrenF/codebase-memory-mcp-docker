 # Overlay: expose CBM's MCP endpoint to Harbor / Open WebUI over Docker networking.
services:
  cbm:
    environment:
      CBM_HTTP_PORT: ${CBM_HTTP_PORT:-8811}
    networks:
      - cdb_default
      - harbor
 
networks:
  cdb_default:
    external: true
    name: codebase-memory-mcp_default
  harbor:
    external: true
    name: harbor_harbor-network
 
