map $http_origin $cbm_origin {
    "https://cbm.example.com:8443"  "http://localhost:9749";
    default                         $http_origin;
}

server {
    listen 8443 ssl;
    server_name cbm.example.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    #auth_basic           "codebase-memory";
    #auth_basic_user_file /etc/nginx/htpasswd;   # htpasswd -B -c htpasswd you

    location / {
        proxy_pass http://cbm:19749;
        proxy_set_header Host   localhost:9749;  # must match CBM_UI_PORT
        proxy_set_header Origin $cbm_origin;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}